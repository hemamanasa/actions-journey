name: Inspect Runner

on: push

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print kernel details and repository files
        run: |
          uname -a
          echo "Repository files:"
          ls -laR

      - name: Count repository files
        run: find . -type f | wc -l
