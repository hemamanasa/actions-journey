name: secret-check

on: push

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check APP_TOKEN is set
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "APP_TOKEN is set."
          else
            echo "APP_TOKEN is missing."
            exit 1
          fi
